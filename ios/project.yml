name: Musing
options:
  bundleIdPrefix: com.oninactive
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Musing:
    type: application
    platform: iOS
    sources:
      - path: Musing
        excludes:
          - "Resources/mock"
          - "Resources/mock/**"
      - path: Musing/Resources/mock
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUSING_BUNDLE_ID)
        PRODUCT_NAME: musing
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: Musing/Info.plist
      properties:
        CFBundleDisplayName: "musing."
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "musing. talks to the prototype server running on your laptop."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - musing
    postCompileScripts:
      - name: Write server config
        basedOnDependencyAnalysis: false
        script: |
          set -e
          ENV_FILE="${SRCROOT}/.env"
          [ -f "$ENV_FILE" ] || ENV_FILE="${SRCROOT}/env.example"
          DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DIR"
          grep -v '^#' "$ENV_FILE" > "$DIR/config.env"
          # this mac's bonjour name works over wifi and over the usb cable; fall back to the lan ip
          NAME=$(scutil --get LocalHostName 2>/dev/null || true)
          if [ -n "$NAME" ]; then HOST="${NAME}.local"; else HOST=$(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || true); fi
          echo "DEV_HOST=${HOST}" >> "$DIR/config.env"
  # drives the real app in the simulator: composer, sends, @muse, chips, votes, mute.
  # needs the local server running and a plan chat to test against (see MusingUITests/README).
  MusingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MusingUITests
    dependencies:
      - target: Musing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUSING_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Musing
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: MusingUITests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
schemes:
  Musing:
    build:
      targets:
        Musing: all
        MusingUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusingUITests
